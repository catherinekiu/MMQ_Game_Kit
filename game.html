<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMQ! • Multiplication Board Game</title><link rel="stylesheet" href="../../shared/mmq-shell.css"><link rel="stylesheet" href="style.css"></head><body data-page="game"><main class="page"><div class="mmq-topnav"><a class="mmq-home" href="menu.html">← <span data-i18n="backMenu">Back to menu</span></a></div><header class="brand mmq-card"><div class="brand-icon">🎯</div><div class="brand-main"><h1 class="title" data-i18n="appTitle">Multiplication Board</h1><p class="subtitle" id="tablesText"></p></div><div class="lang-switch"><label for="langSelect" data-i18n="language">Language</label><select id="langSelect"><option value="en">English (UK)</option><option value="zh">简体中文</option></select></div></header><section class="game-card mmq-card"><div class="game-header"><div id="question" class="question" data-i18n="ready">Ready?</div><div id="timer" class="timer-box">15</div></div><div class="players"><article id="player1Panel" class="player-panel"><div class="player-top"><div><div id="p1Label" class="player-name">Player 1</div><div id="p1Lines" class="lines"></div></div><div id="p1Score" class="score">0</div></div><div id="board1" class="board"></div></article><article id="player2Panel" class="player-panel"><div class="player-top"><div><div id="p2Label" class="player-name">Player 2</div><div id="p2Lines" class="lines"></div></div><div id="p2Score" class="score">0</div></div><div id="board2" class="board"></div></article></div><div id="turnMessage" class="turn-message" data-i18n="pressStart">Press Start to begin.</div><div class="footer-actions"><button id="startGameBtn" class="mmq-btn green" type="button" data-i18n="start">Start game</button><button id="menuBtn" class="mmq-btn secondary" type="button" data-i18n="backMenu">Back to menu</button></div></section></main><div id="intermission" class="intermission"><div class="intermission-card"><p i
