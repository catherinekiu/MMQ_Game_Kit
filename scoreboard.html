<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMQ! • Scoreboard</title><link rel="stylesheet" href="../../shared/mmq-shell.css"><link rel="stylesheet" href="style.css"></head><body data-page="scoreboard"><main class="page"><div class="mmq-topnav"><a class="mmq-home" href="menu.html">← <span data-i18n="backMenu">Back to menu</span></a></div><header class="brand mmq-card"><div class="brand-icon">⭐</div><div class="brand-main"><h1 class="title" data-i18n="scoreboard">Scoreboard</h1><p class="subtitle" data-i18n="topScores">Top 10 scores saved on this device.</p></div><div class="lang-switch"><label for="langSelect" data-i18n="language">Language</label><select id="langSelect"><option value="en">English (UK)</option><option value="zh">简体中文</option></select></div></header><section class="card mmq-card scoreboard-card">
<div class="scoreboard-banner">
  <div class="scoreboard-banner-icon" aria-hidden="true">🏆</div>
  <div class="scoreboard-banner-text">
    <strong class="scoreboard-banner-title">Top 10 Champions</strong>
    <span class="scoreboard-banner-subtitle" data-i18n="topScores">Top 10 scores saved on this device.</span>
  </div>
</div>
<div class="filters scoreboard-filters"><input id="searchPlayer" data-i18n-placeholder="search" placeholder="Search player"><select id="tableFilter"></select></div><p class="score-filter-note" data-i18n="mixedFilterNote">Games using 2–8 times tables are grouped under Mixed only.</p><div class="table-wrap scoreboard-table-wrap"><table class="scoreboard-table"><thead><tr><th data-i18n="rank">Rank</th><th data-i18n="player">Player</th><th data-i18n="score">Score</th><th data-i18n="tables">Tables</th></tr></thead><tbody id="scoreRows"></tbody></table></div><div id="scoreEmpty" class="empty hidden" data-i18n="noScores">No scores yet.</div><div class="footer-actions"><button id="historyBtn" class="mmq-btn secondary" type="button" data-i18n="history">History</button></div></section></main><script src="script.js"></script></body></html>
