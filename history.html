<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMQ! • Game History</title><link rel="stylesheet" href="../../shared/mmq-shell.css"><link rel="stylesheet" href="style.css"></head><body data-page="history"><main class="page"><div class="mmq-topnav"><a class="mmq-home" href="menu.html">← <span data-i18n="backMenu">Back to menu</span></a></div><header class="brand mmq-card"><div class="brand-icon">📋</div><div class="brand-main"><h1 class="title" data-i18n="history">Game history</h1><p class="subtitle" data-i18n="historySubtitle">Matches saved on this device.</p></div><div class="lang-switch"><label for="langSelect" data-i18n="language">Language</label><select id="langSelect"><option value="en">English (UK)</option><option value="zh">简体中文</option></select></div></header><section class="card mmq-card"><div class="filters"><input id="searchPlayer" data-i18n-placeholder="search" placeholder="Search player"><select id="tableFilter"></select></div><div class="table-wrap"><table><thead><tr><th data-i18n="date">Date</th><th data-i18n="player1">Player 1</th><th data-i18n="score">Score</th><th data-i18n="player2">Player 2</th><th data-i18n="score">Score</th><th data-i18n="tables">Tables</th></tr></thead><tbody id="historyRows"></tbody></table></div><div id="historyEmpty" class="empty hidden" data-i18n="noHistory">No matches yet.</div><div class="footer-actions"><button id="clearHistory" class="mmq-btn danger" type="button" data-i18n="clearHistory">Clear history</button><button id="scoreboardBtn" class="mmq-btn secondary" type="button" data-i18n="scoreboard">Scoreboard</button></div></section></main><script src="script.js"></script></body></html>
